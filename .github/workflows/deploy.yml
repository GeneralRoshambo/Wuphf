name: Deploy to cPanel
# Deploys to wuphf.lol after a push to main (or the working branch below), or by hand
# from the Actions tab. Add these under Settings > Secrets and variables > Actions:
#   CPANEL_HOST, CPANEL_USER, CPANEL_TOKEN, DEPLOY_DIR (optional), SITE_URL (optional)
# A PHP syntax check runs first, so a broken push is not deployed.
on:
  push:
    branches: [main, ccr-1fe5f2ce-2m8vic]
  workflow_dispatch: {}
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: |
          command -v php >/dev/null || sudo apt-get install -y php-cli
          for f in *.php; do php -l "$f"; done
          node --check assets/app.js
      - name: Upload to cPanel
        run: ./tools/deploy.sh
        env:
          ALLOW_SKIP: "1"
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          SITE_URL: ${{ secrets.SITE_URL }}
